syntax = "proto3";

package medirdv.praticien.v1;

option java_multiple_files = true;
option java_package = "com.medirdv.praticien.grpc";
option java_outer_classname = "PraticienProto";

// Contrat partagé praticien-service (serveur) <-> rendezvous-service (client).
// Mapping d'erreurs attendu :
//   NOT_FOUND            créneau inexistant
//   FAILED_PRECONDITION  créneau déjà réservé (Reserver)
//   INVALID_ARGUMENT     request_id / creneau_id invalide
//   DEADLINE_EXCEEDED / UNAVAILABLE  gérés côté client (retry idempotent)
service PraticienService {
  // Idempotent grâce à request_id : la réservation place le créneau en attente
  // de la décision du praticien (accepter/refuser via l'API REST).
  rpc ReserverCreneau(ReserverCreneauRequest) returns (ReserverCreneauResponse);

  // Compensation. Libérer un créneau déjà libre est un no-op réussi.
  rpc LibererCreneau(LibererCreneauRequest) returns (LibererCreneauResponse);

  // Streaming serveur, appelé sous deadline (5 s côté client).
  rpc ListerCreneauxDisponibles(ListerCreneauxDisponiblesRequest) returns (stream Creneau);
}

message ReserverCreneauRequest {
  reserved 3;
  reserved "patient_id";
  string request_id = 1; // UUID
  int64 creneau_id = 2;
}

message ReserverCreneauResponse {
  int64 creneau_id = 1;
  int64 praticien_id = 2;
  // true si cette request_id avait déjà été traitée (rejeu)
  bool deja_traite = 3;
}

message LibererCreneauRequest {
  string request_id = 1; // UUID
  int64 creneau_id = 2;
}

message LibererCreneauResponse {
  int64 creneau_id = 1;
}

message ListerCreneauxDisponiblesRequest {
  string specialite = 1;
  string du = 2; // ISO-8601 date-time, inclusif
  string au = 3; // ISO-8601 date-time, exclusif
}

message Creneau {
  int64 id = 1;
  int64 praticien_id = 2;
  string praticien_nom = 3;
  string specialite = 4;
  string debut = 5; // ISO-8601 date-time
  string fin = 6;   // ISO-8601 date-time
}
