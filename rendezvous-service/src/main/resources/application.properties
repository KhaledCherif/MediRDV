# === Application ===
spring.application.name=rdv-core
# Port 8083 for rendezvous-service (docker-compose maps 8083)
server.port=${SERVER_PORT:8083}

# === Actuator ===
# health,info exposes the two monitoring endpoints.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# === PostgreSQL Database ===
# Database configuration follows the patient-service convention.
# rdv_db is a proposed separate database, not the existing patient_db.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rdv_db}
spring.datasource.username=${DB_USERNAME:rdv_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# === SQL Init ===
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# === patient-service REST client (#24) ===
# Local default; in Docker use PATIENT_SERVICE_URL=http://patient-service:8081
patient-service.base-url=${PATIENT_SERVICE_URL:http://localhost:8081}
patient-service.connect-timeout=2s
patient-service.read-timeout=3s

# === praticien-service gRPC client (Suivi 2) ===
# In Docker: PRATICIEN_GRPC_HOST=praticien-service, PRATICIEN_GRPC_PORT=9090
praticien-service.grpc.host=${PRATICIEN_GRPC_HOST:localhost}
praticien-service.grpc.port=${PRATICIEN_GRPC_PORT:9090}
# Explicit deadlines: 2s for ReserverCreneau/LibererCreneau, 5s for the ListerCreneauxDisponibles stream
praticien-service.grpc.unary-deadline=2s
praticien-service.grpc.streaming-deadline=5s

# Metadata for consultation declarations (REST endpoints owned by praticien-service)
praticien-service.rest.base-url=${PRATICIEN_REST_URL:http://localhost:8082}
praticien-service.rest.timeout=3s

# === assurance-legacy SOAP client (Suivi 2) ===
# In Docker: ASSURANCE_SOAP_URL=http://assurance-legacy:8080/ws
assurance-legacy.soap.url=${ASSURANCE_SOAP_URL:http://localhost:8080/ws}
# Connect + read timeout of the WebServiceTemplate
assurance-legacy.soap.timeout=3s

# === OpenAPI (#28) ===
# Swagger UI: http://localhost:8083/swagger-ui.html  -  spec: /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
# Use contract-first OpenAPI spec
springdoc.swagger-ui.url=/openapi.yaml
