# =====================================================================
# application.properties - service assurance-legacy (MediRDV)
# SOAP Contract-First via Spring-WS
# Base de donnees : PostgreSQL uniquement (AUCUNE base H2)
# =====================================================================

spring.application.name=assurance-legacy
server.port=8080

# ---------------------------------------------------------------
# Datasource PostgreSQL (valeurs par défaut surchargeables par variables d'environnement)
# ---------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assurance_legacy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:assurance}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:assurance123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------
# JPA / Hibernate - Dialecte PostgreSQL
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------
# SQL Init - Load sample data
# ---------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ---------------------------------------------------------------
# Actuator - health expose
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ---------------------------------------------------------------
# NOTE : aucune propriete spring.datasource.h2* n'est presente.
# H2 est totalement exclu de ce service.
# =====================================================================
