# === Application ===
spring.application.name=rdv-core
# Port 8082 is our proposed port for rdv-core, separate from patient-service's 8081.
server.port=${SERVER_PORT:8082}

# === Actuator ===
# health,info exposes the two monitoring endpoints.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# === PostgreSQL Database ===
# Database configuration follows the patient-service convention.
# rdv_db is a proposed separate database, not the existing patient_db.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/rdv_db}
spring.datasource.username=${DB_USERNAME:rdv_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# === patient-service REST client (#24) ===
# Local default; in Docker use PATIENT_SERVICE_URL=http://patient-service:8081
patient-service.base-url=${PATIENT_SERVICE_URL:http://localhost:8081}
patient-service.connect-timeout=2s
patient-service.read-timeout=3s

# === OpenAPI (#28) ===
# Swagger UI: http://localhost:8082/swagger-ui.html  -  spec: /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
